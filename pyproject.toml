[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapG"
version = "0.13.8"
description = "Scalable Shapley Value Computation for Graph Data with Modular Architecture"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Chi Zhao", email = "dandanv5@hotmail.com"}
]
keywords = [
    "shapley value",
    "feature importance",
    "explainable AI",
    "graph algorithms",
    "XAI",
    "machine learning interpretability"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "networkx>=2.8",
    "numpy",
    "pandas>=1.3",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "tqdm>=4.62",
    "scikit-learn>=1.0",
    "tabulate>=0.8",
    "loguru>=0.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "black>=23.0",
    "isort>=5.10",
    "flake8>=6.0",
    "mypy>=1.0",
    "pre-commit>=3.0"
]

performance = [
    "numba>=0.56",
    "ray>=2.0",
    "joblib>=1.2"
]

docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8"
]

examples = [
    "lightgbm>=3.3",
    "seaborn>=0.11"
]

all = [
    "shapG[dev,performance,docs,examples]"
]

[project.urls]
Homepage = "https://github.com/vectorsss/shapG"
Documentation = "https://github.com/vectorsss/shapG#readme"
Repository = "https://github.com/vectorsss/shapG"
Issues = "https://github.com/vectorsss/shapG/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["shapG*"]

[tool.setuptools.package-data]
shapG = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["shapG"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
