name: Publish

# Publish on tag push: final versions (e.g. v0.15.0) go to PyPI, pre-releases
# (e.g. v0.15.0rc1, v0.15.0a1, v0.15.0.dev1) go to TestPyPI. Routing is by the
# built version's PEP 440 pre-release status. Authentication uses PyPI Trusted
# Publishing (OIDC) -- no API tokens/secrets required.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so setuptools-scm derives the tagged version.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build packaging
          python -m build

      - name: Classify version (final vs pre-release)
        id: classify
        run: |
          VERSION=$(python -c "import glob, os; print(os.path.basename(glob.glob('dist/*.whl')[0]).split('-')[1])")
          PRE=$(python -c "from packaging.version import Version; print(str(Version('$VERSION').is_prerelease).lower())")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Built shapG $VERSION (prerelease=$PRE)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shapG/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/shapG/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
